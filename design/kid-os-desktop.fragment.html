<style>
#kid-os-concept .os{--surface:light-dark(#d8d8cd,#343c3b);--paper:light-dark(#fffef5,#242e2d);--ink:light-dark(#202e2d,#edf3e9);--dim:light-dark(#53625d,#a8bab0);--hi:light-dark(#ffffef,#64746d);--lo:light-dark(#77877e,#17201e);--wall:light-dark(#23776f,#174e49);--title:light-dark(#233c65,#263e62);--cream:#f3edcf;--yellow:light-dark(#f1c65d,#b19043);--blue:light-dark(#a5c8d8,#608895);--pink:light-dark(#e7b1a4,#af7f72);--green:light-dark(#b3cd92,#7e9a62);--lavender:light-dark(#c4b6d4,#9384a6);--bevel:inset 2px 2px var(--hi),inset -2px -2px var(--lo);font:15px/1.4 'Trebuchet MS',Verdana,sans-serif;color:var(--ink);background:var(--wall);position:relative;min-height:590px;isolation:isolate;display:flex;flex-direction:column;border:3px solid var(--surface);box-shadow:var(--bevel)}
#kid-os-concept .os *{box-sizing:border-box}#kid-os-concept [hidden]{display:none!important}#kid-os-concept button{font:inherit;color:inherit;border-radius:0;cursor:inherit}#kid-os-concept button:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}#kid-os-concept .retro{background:var(--surface);border:0;box-shadow:var(--bevel);padding:10px 14px;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px}#kid-os-concept .retro:active{box-shadow:inset 2px 2px var(--lo),inset -2px -2px var(--hi)}#kid-os-concept .retro svg{width:18px;height:18px}#kid-os-concept .desk{position:relative;flex:1;padding:28px;min-height:530px;background-image:radial-gradient(#ffffff12 1px,transparent 1px);background-size:4px 4px}#kid-os-concept .desktop-apps{display:grid;grid-template-columns:100px 100px;gap:28px 18px;position:relative;z-index:1;width:max-content}#kid-os-concept .app-icon{background:transparent;border:0;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;padding:4px;color:var(--cream);min-height:100px;font-size:14px;letter-spacing:.2px}#kid-os-concept .app-icon:hover .label,#kid-os-concept .app-icon:focus-visible .label{background:var(--title)}#kid-os-concept .label{padding:2px 5px}#kid-os-concept .icon-box{width:55px;height:49px;background:var(--yellow);color:#25362c;border:2px solid #24392d;box-shadow:inset 3px 3px #ffffff70,3px 3px #113a3950;display:grid;place-items:center}#kid-os-concept .icon-box svg{width:30px;height:30px;stroke-width:1.8}#kid-os-concept [data-app="make"] .icon-box{background:var(--pink)}#kid-os-concept [data-app="play"] .icon-box{background:var(--lavender)}#kid-os-concept [data-app="library"] .icon-box{background:var(--blue)}#kid-os-concept [data-app="explore"] .icon-box{background:var(--green)}#kid-os-concept [data-app="mail"] .icon-box{background:var(--cream)}#kid-os-concept .wall-word{position:absolute;left:37%;top:116px;right:5%;color:var(--cream);pointer-events:none}#kid-os-concept .wordmark{font-family:ui-monospace,monospace;font-size:clamp(48px,8vw,94px);letter-spacing:-8px;line-height:1.1;font-weight:800;text-shadow:4px 4px #153f3c;display:block}#kid-os-concept .wall-word p{font-size:16px;margin:15px 0;letter-spacing:1px}#kid-os-concept .wall-word .tiny{font:12px ui-monospace,monospace;opacity:.75;margin-top:36px;letter-spacing:1px}#kid-os-concept .corner-note{position:absolute;right:24px;bottom:24px;color:var(--cream);font:12px ui-monospace,monospace;opacity:.75}#kid-os-concept .taskbar{background:var(--surface);box-shadow:inset 0 2px var(--hi);padding:6px;display:flex;gap:7px;align-items:center;position:relative;z-index:5;min-height:53px}#kid-os-concept .start-button{font-weight:700}#kid-os-concept .task-current{min-width:110px;justify-content:flex-start}#kid-os-concept .tray{margin-left:auto;display:flex;gap:12px;align-items:center;font:12px ui-monospace,monospace;padding:9px 12px;box-shadow:inset 1px 1px var(--lo),inset -1px -1px var(--hi)}#kid-os-concept .tray svg{width:16px;height:16px}#kid-os-concept .start-menu{position:absolute;bottom:59px;left:6px;background:var(--surface);box-shadow:var(--bevel),5px 5px #102d3b55;z-index:8;width:270px;max-width:calc(100% - 12px);padding:6px 6px 6px 39px}#kid-os-concept .start-strip{position:absolute;left:4px;bottom:4px;top:4px;width:29px;background:var(--title);color:var(--cream);writing-mode:vertical-rl;transform:rotate(180deg);padding:12px 4px;font:bold 20px ui-monospace,monospace;letter-spacing:1px}#kid-os-concept .menu-item{width:100%;display:flex;gap:12px;align-items:center;background:transparent;border:0;padding:10px;text-align:left;min-height:42px}#kid-os-concept .menu-item:hover{background:var(--title);color:var(--cream)}#kid-os-concept .menu-item svg{width:20px;height:20px}#kid-os-concept .menu-rule{border:0;border-top:1px solid var(--lo);border-bottom:1px solid var(--hi);margin:4px}#kid-os-concept .window{position:relative;z-index:3;background:var(--surface);padding:4px;box-shadow:var(--bevel),8px 8px #11333166;max-width:720px;margin:0 0 0 auto;min-height:454px}#kid-os-concept .os.computer:has(.window:not([hidden])) .desktop-apps{position:absolute;grid-template-columns:100px;gap:4px;left:18px;top:20px}#kid-os-concept .os.computer:has(.window:not([hidden])) .app-icon{min-height:75px;gap:3px;font-size:12px}#kid-os-concept .os.computer:has(.window:not([hidden])) .icon-box{width:43px;height:37px}#kid-os-concept .os.computer:has(.window:not([hidden])) .window{width:calc(100% - 118px)}#kid-os-concept .titlebar{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--title);color:#fff9e8;min-height:40px;padding:4px 5px 4px 11px;font-weight:700}#kid-os-concept .titlebar .retro{padding:0;width:32px;min-height:30px;color:var(--ink)}#kid-os-concept .window-tools{padding:10px 12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--lo);font:12px ui-monospace,monospace}#kid-os-concept .window-tools button{padding:6px 9px;min-height:32px}#kid-os-concept .window-content{background:var(--paper);padding:22px;min-height:321px}#kid-os-concept h2{font-size:25px;letter-spacing:-.8px;margin:0 0 6px;font-weight:700;line-height:1.25}#kid-os-concept .sub{color:var(--dim);margin:0 0 22px;font-size:13px}#kid-os-concept .item-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}#kid-os-concept .item{background:transparent;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:7px;min-width:0}#kid-os-concept .item strong{font-size:14px;font-weight:700;overflow-wrap:anywhere}#kid-os-concept .item small{font-size:12px;color:var(--dim)}#kid-os-concept .art{width:100%;min-height:108px;background:var(--yellow);color:#273931;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px #20362d30}#kid-os-concept .art svg{width:39px;height:39px;stroke-width:1.5}#kid-os-concept .item:nth-child(2) .art{background:var(--blue)}#kid-os-concept .item:nth-child(3) .art{background:var(--pink)}#kid-os-concept .item:nth-child(4) .art{background:var(--green)}#kid-os-concept .window-foot{font:11px ui-monospace,monospace;padding:7px 9px;color:var(--dim);min-height:29px}#kid-os-concept .detail{display:grid;grid-template-columns:145px 1fr;gap:22px;align-items:center}#kid-os-concept .detail .art{height:180px}#kid-os-concept .detail p{font-size:14px;line-height:1.7}#kid-os-concept .detail h2{font-size:26px}#kid-os-concept .tablet .desk{padding:36px 42px}#kid-os-concept .home-heading{color:var(--cream);margin-bottom:26px;display:flex;justify-content:space-between;gap:15px;align-items:center}#kid-os-concept .home-heading strong{font:700 28px ui-monospace,monospace;letter-spacing:-2px}#kid-os-concept .home-heading small{font:12px ui-monospace,monospace}#kid-os-concept .tablet .desktop-apps{width:100%;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}#kid-os-concept .tablet .app-icon{background:#ffffff0c;border:1px solid #ffffff25;padding:22px 10px;min-height:155px;font-size:17px}#kid-os-concept .tablet .icon-box{width:69px;height:60px}#kid-os-concept .tablet .wall-word,#kid-os-concept .tv .wall-word{display:none}#kid-os-concept .tablet .window,#kid-os-concept .tv .window{max-width:none;width:100%;margin:0;box-shadow:var(--bevel)}#kid-os-concept .tablet:has(.window:not([hidden])) .desktop-apps,#kid-os-concept .tv:has(.window:not([hidden])) .desktop-apps{display:none}#kid-os-concept .tablet:has(.window:not([hidden])) .home-heading,#kid-os-concept .tv:has(.window:not([hidden])) .home-heading{display:none}#kid-os-concept .tv .desk{padding:35px 44px}#kid-os-concept .tv .desktop-apps{width:100%;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}#kid-os-concept .tv .app-icon{background:var(--surface);color:var(--ink);box-shadow:var(--bevel);font-size:22px;min-height:160px;gap:14px}#kid-os-concept .tv .app-icon:nth-child(n+4){min-height:86px;flex-direction:row;font-size:16px}#kid-os-concept .tv .app-icon:nth-child(n+4) .icon-box{width:37px;height:34px}#kid-os-concept .tv .app-icon:nth-child(n+4) svg{width:21px;height:21px}#kid-os-concept .tv .app-icon:focus-visible{outline:4px solid var(--cream);outline-offset:5px}#kid-os-concept .tv .label{background:transparent!important}#kid-os-concept .tv .icon-box{width:73px;height:65px}#kid-os-concept .tv .taskbar{padding:8px 15px}#kid-os-concept .tv .window-content{padding:25px}#kid-os-concept .tv .item strong{font-size:18px}#kid-os-concept .tv .sub,#kid-os-concept .tv .item small{font-size:15px}#kid-os-concept .tv .art{min-height:120px}#kid-os-concept .os .status-note{font:12px ui-monospace,monospace;color:var(--dim);margin-top:18px}#kid-os-concept .wall-options{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}#kid-os-concept .wall-options button{min-width:100px}#kid-os-concept .wall-options button[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:3px}
@media(max-width:750px){#kid-os-concept .os.computer:has(.window:not([hidden])) .desktop-apps{display:none}#kid-os-concept .os.computer:has(.window:not([hidden])) .window{width:100%}#kid-os-concept .wordmark{font-size:65px}#kid-os-concept .wall-word{left:45%;top:130px}#kid-os-concept .wall-word p{max-width:180px}#kid-os-concept .tv .desk,#kid-os-concept .tablet .desk{padding:24px}}
@media(max-width:480px){#kid-os-concept .desk{padding:18px;min-height:590px}#kid-os-concept .os{min-height:649px}#kid-os-concept .wall-word{position:static;margin:28px 0 0 12px}#kid-os-concept .wordmark{font-size:45px;letter-spacing:-4px}#kid-os-concept .wall-word p{font-size:13px;max-width:none;margin:6px 0}#kid-os-concept .wall-word .tiny{display:none}#kid-os-concept .desktop-apps{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%}#kid-os-concept .corner-note{display:none}#kid-os-concept .tablet .desktop-apps,#kid-os-concept .tv .desktop-apps{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}#kid-os-concept .tablet .app-icon{padding:16px 8px;min-height:130px;font-size:15px}#kid-os-concept .tv .app-icon,#kid-os-concept .tv .app-icon:nth-child(n+4){flex-direction:column;min-height:135px;font-size:17px;gap:8px}#kid-os-concept .tv .app-icon:nth-child(n+4) .icon-box{width:55px;height:49px}#kid-os-concept .tv .icon-box{width:55px;height:49px}#kid-os-concept .tv .home-heading small{max-width:92px;text-align:right}#kid-os-concept .item-grid{grid-template-columns:repeat(2,minmax(0,1fr))}#kid-os-concept .window-content,#kid-os-concept .tv .window-content{padding:16px}#kid-os-concept .detail{grid-template-columns:1fr}#kid-os-concept .detail .art{height:110px}#kid-os-concept .tray{padding:8px;font-size:11px;gap:7px}#kid-os-concept .tray svg{display:none}#kid-os-concept .task-current{min-width:0;padding:8px;font-size:12px}#kid-os-concept .home-heading{margin-bottom:20px}#kid-os-concept .home-heading small{font-size:11px}#kid-os-concept .tv .item strong{font-size:15px}#kid-os-concept .tv .item small{font-size:12px}#kid-os-concept .window-tools{flex-wrap:wrap}}

</style>
<div id="kid-os-concept" class="viz-carousel" aria-label="kidOS device modes">
<section data-variant="Computer" aria-label="Computer desktop"><div class="os computer" data-mode="computer" aria-label="kidOS computer"></div></section>
<section data-variant="Tablet" aria-label="Tablet home" hidden><div class="os tablet" data-mode="tablet" aria-label="kidOS tablet"></div></section>
<section data-variant="TV" aria-label="TV home" hidden><div class="os tv" data-mode="tv" aria-label="kidOS TV"></div></section>
</div>
<script>
(()=>{
const root=document.getElementById('kid-os-concept');
const apps={stuff:{name:'My Stuff',icon:'folder-open'},make:{name:'Make',icon:'paintbrush'},play:{name:'Play',icon:'gamepad-2'},library:{name:'Library',icon:'book-open'},explore:{name:'Explore',icon:'compass'},mail:{name:'Mailbox',icon:'mail'}};
const catalogs={
stuff:{heading:'All yours.',sub:'Things you made. Things you kept.',items:[['My drawings','8 drawings','image','drawing'],['My projects','3 experiments','blocks','projects'],['My stories','2 stories','notebook-pen','story']]},
make:{heading:'What do you want to make?',sub:'Pick a tool. Start something.',items:[['Draw','A blank page, all yours','paintbrush','draw'],['Write','Stories, comics, big ideas','notebook-pen','write'],['Code','Games and experiments','code-xml','code']]},
play:{heading:'One more adventure?',sub:'Your little arcade.',items:[['Moon hopper','Made for remixing','orbit','frog'],['Tiny racer','Ready, set, go','flag','racer'],['Puzzle box','A little brain stretch','puzzle','puzzle']]},
library:{heading:'Find a good rabbit hole.',sub:'Books, films, and sounds picked for your world.',items:[['The night sky','Read · 12 pages','moon-star','sky'],['Small wild things','Watch · Nature collection','sprout','nature'],['Rainy day radio','Listen · Sounds & stories','headphones','radio']]},
explore:{heading:'Follow your curiosity.',sub:'A few good places to start.',items:[['Out in space','Planets, stars, big questions','telescope','space'],['In the backyard','Small things worth noticing','bug','backyard'],['How stuff works','Take a closer look','cog','machines']]},
mail:{heading:'Hello from your people.',sub:'Your family postbox.',items:[['A note from Dad','An idea for this weekend','mail-open','letter'],['Send a drawing','Pick something you made','send','send']]}}
const detailText={drawing:['My drawings','Your gallery','Eight pictures, one very distinctive artist. Choose a picture to see it full screen.'],projects:['My projects','Your workbench','Moon hopper, a secret clubhouse page, and a very noisy button.'],story:['The moon has a door','Your story','Nobody noticed the little blue door until the moon turned sideways.'],draw:['Drawing pad','Make / Draw','A big canvas, a few good colors, and an undo button.'],write:['A fresh page','Make / Write','Once upon a time, something very strange happened…'],code:['Code workshop','Make / Code','Start with a working project. Change the rules. See what happens.'],frog:['Moon hopper','Play / Your arcade','A frog, low gravity, and a long way home.'],racer:['Tiny racer','Play / Your arcade','Build a track and challenge your best lap.'],puzzle:['Puzzle box','Play / Your arcade','A fresh collection of small puzzles.'],sky:['The night sky','Library / Read','Somewhere above your roof, a whole universe is carrying on. Tonight, find the brightest thing you can see. Is it a star—or a planet?'],nature:['Small wild things','Library / Watch','A collection of short films about the tiny creatures around us.'],radio:['Rainy day radio','Library / Listen','Gentle stories and curious sounds for a slow afternoon.'],space:['Out in space','Explore / Space','What would your shadow look like on a planet with two suns?'],backyard:['In the backyard','Explore / Nature','Find something smaller than your fingernail. Draw it as if it were the size of a house.'],machines:['How stuff works','Explore / Machines','Choose an everyday object. What do you think is happening inside it?'],letter:['An excellent Saturday plan','From Dad','Want to build a cardboard spaceship this weekend? You design the control panel. I’ll find the biggest box.'],send:['Send a little hello','Mailbox / New note','Pick a drawing or write a note, then choose someone in your family.']};
const states={computer:{app:null,detail:null,start:false},tablet:{app:null,detail:null,start:false},tv:{app:null,detail:null,start:false}};
let wallpaper='Teal';
const icon=n=>'<i data-lucide="'+n+'" aria-hidden="true"></i>';
const button=(label,attrs,cls='retro')=>'<button type="button" class="'+cls+' cursor-interaction" '+attrs+'>'+label+'</button>';
function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{design:'kidOS retro desktop',wallpaper},privateContent:{states,wallpaper}}).catch(()=>{});}
function restore(x){const s=x?.privateContent;if(!s)return;if(['Teal','Plum','Night'].includes(s.wallpaper))wallpaper=s.wallpaper;for(const m of Object.keys(states)){const a=s.states?.[m];if(a&&(a.app===null||apps[a.app]||['wallpaper','parents'].includes(a.app)))states[m]={app:a.app,detail:detailText[a.detail]?a.detail:null,start:!!a.start};}}
function appButton(key,cls='app-icon'){return button('<span class="icon-box">'+icon(apps[key].icon)+'</span><span class="label">'+apps[key].name+'</span>','data-app="'+key+'"',cls);}
function contents(s){if(s.app==='wallpaper')return '<h2>Make yourself at home.</h2><p class="sub">Pick a desktop color.</p><div class="wall-options">'+['Teal','Plum','Night'].map(c=>button(c,'data-wall="'+c+'" aria-pressed="'+(wallpaper===c)+'"')).join('')+'</div>';
if(s.app==='parents')return '<div class="detail"><div class="art">'+icon('lock-keyhole')+'</div><div><h2>Grown-up settings</h2><p>Manage family members, add library content, and choose what’s available on this device.</p><p class="status-note">Design preview · parent sign-in would appear here.</p></div></div>';
if(s.detail){const d=detailText[s.detail];const item=catalogs[s.app]?.items.find(i=>i[3]===s.detail);return '<div class="detail"><div class="art">'+icon(item?.[2]||'file')+'</div><div><p class="sub">'+d[1]+'</p><h2>'+d[0]+'</h2><p>'+d[2]+'</p></div></div>';}
const c=catalogs[s.app];return '<h2>'+c.heading+'</h2><p class="sub">'+c.sub+'</p><div class="item-grid">'+c.items.map(i=>button('<span class="art">'+icon(i[2])+'</span><strong>'+i[0]+'</strong><small>'+i[1]+'</small>','data-detail="'+i[3]+'"','item')).join('')+'</div>';}
function applyWallpaper(){const colors={Teal:'light-dark(#23776f,#174e49)',Plum:'light-dark(#716080,#453853)',Night:'light-dark(#344a6e,#22314c)'};root.querySelectorAll('.os').forEach(el=>el.style.setProperty('--wall',colors[wallpaper]));}
function render(os){const mode=os.dataset.mode,s=states[mode];const title=apps[s.app]?.name||(s.app==='wallpaper'?'Your desktop':'Grown-up settings');const order=mode==='tv'?['library','play','explore','stuff','make','mail']:['stuff','make','play','library','explore','mail'];
os.innerHTML='<div class="desk">'+(mode!=='computer'?'<div class="home-heading"><strong>kidOS<span aria-hidden="true">▰</span></strong><small>'+(mode==='tv'?'Your world, a little bigger.':'Your very own little world.')+'</small></div>':'')+'<div class="desktop-apps" aria-label="Apps">'+order.map(k=>appButton(k)).join('')+'</div><div class="wall-word" '+(s.app?'hidden':'')+'><span class="wordmark">kidOS<span aria-hidden="true">▰</span></span><p>A little world of your own.</p><div class="tiny">PLAY. MAKE. WONDER. REPEAT.</div></div><section class="window" aria-label="'+title+'" '+(!s.app?'hidden':'')+'><div class="titlebar"><span>'+title+'</span>'+button(icon('x'),'data-action="home" aria-label="Close app"')+'</div><div class="window-tools">'+button(icon(s.detail?'arrow-left':'house')+(s.detail?'Back':'Home'),'data-action="back"')+'<span>'+ (s.detail?'Your world / '+title:title)+'</span></div><div class="window-content" aria-live="polite">'+(s.app?contents(s):'')+'</div><div class="window-foot">'+(s.app==='parents'?'Parent controls concept':s.detail?'Sample content · interface preview':'Your world. Your pace.')+'</div></section>'+(!s.app?'<span class="corner-note">A place for curious minds.</span>':'')+'</div><div class="start-menu" '+(!s.start?'hidden':'')+'><div class="start-strip">kidOS</div>'+Object.keys(apps).map(k=>button(icon(apps[k].icon)+apps[k].name,'data-app="'+k+'"','menu-item')).join('')+'<hr class="menu-rule">'+button(icon('palette')+'Change wallpaper','data-app="wallpaper"','menu-item')+button(icon('lock-keyhole')+'Grown-ups','data-app="parents"','menu-item')+'</div><footer class="taskbar">'+button(icon(mode==='computer'?'blocks':'house')+(mode==='computer'?'Start':'Home'),'data-action="'+(mode==='computer'?'start':'home')+'" '+(mode==='computer'?'aria-expanded="'+s.start+'"':''),'retro start-button')+(mode!=='computer'?button(icon('menu'),'data-action="start" aria-label="Open menu" aria-expanded="'+s.start+'"'):'')+(s.app?button(title,'data-action="app"','retro task-current'):'')+'<div class="tray">'+icon('volume-2')+'<span>4:08 PM</span></div></footer>';
applyWallpaper();if(globalThis.lucide)lucide.createIcons();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const os=b.closest('.os');if(!os)return;const s=states[os.dataset.mode];if(b.dataset.app){s.app=b.dataset.app;s.detail=null;s.start=false;}else if(b.dataset.detail){s.detail=b.dataset.detail;}else if(b.dataset.wall){wallpaper=b.dataset.wall;}else if(b.dataset.action==='start'){s.start=!s.start;}else if(b.dataset.action==='home'){s.app=null;s.detail=null;s.start=false;}else if(b.dataset.action==='back'){if(s.detail)s.detail=null;else s.app=null;}else return;render(os);save();});
root.addEventListener('keydown',e=>{const os=e.target.closest('.os');if(!os)return;const s=states[os.dataset.mode];if(e.key==='Escape'){s.start=false;if(s.detail)s.detail=null;else s.app=null;render(os);os.querySelector('button')?.focus();save();return;}if(os.dataset.mode!=='tv'||!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))return;const current=e.target.closest('button');if(!current)return;const rect=current.getBoundingClientRect();const cx=rect.x+rect.width/2,cy=rect.y+rect.height/2;const vertical=e.key==='ArrowUp'||e.key==='ArrowDown';const sign=e.key==='ArrowUp'||e.key==='ArrowLeft'?-1:1;const choices=[...os.querySelectorAll('button')].filter(b=>b!==current&&b.getClientRects().length).map(b=>{const r=b.getBoundingClientRect(),dx=r.x+r.width/2-cx,dy=r.y+r.height/2-cy;return {b,forward:(vertical?dy:dx)*sign,side:Math.abs(vertical?dx:dy)};}).filter(c=>c.forward>5).sort((a,b)=>(a.forward+a.side*3)-(b.forward+b.side*3));if(choices.length){e.preventDefault();choices[0].b.focus();}});
restore(window.openai?.widgetState);root.querySelectorAll('.os').forEach(render);window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);root.querySelectorAll('.os').forEach(render);}});
if(globalThis.Tweak){root.querySelectorAll('.os').forEach(os=>{const design={wallpaper};const tweak=new Tweak({container:os,onChange:()=>{wallpaper=design.wallpaper;applyWallpaper();}});tweak.addSelect(design,'wallpaper',{label:'Desktop color',options:['Teal','Plum','Night']});});}
})();
</script>
